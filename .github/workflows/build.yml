name: Build EDH Tlty APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython==0.29.37

      - name: Installer les outils Android
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Nettoyer les anciens fichiers
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Construire APK
        env:
          PIP_VERSION: "24.0"
        run: |
          python -m pip install pip==24.0
          buildozer -v android debug

      - name: Télécharger APK
        uses: actions/upload-artifact@v4
        with:
          name: EDH-Tlty-APK
          path: bin/*.apk
